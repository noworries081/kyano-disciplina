<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <title>Discipline · Dagelijks</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-dim: #0ea5e9;
      --green: #22c55e;
      --green-bg: rgba(34, 197, 94, 0.12);
      --red: #f87171;
      --orange: #fbbf24;
      --purple: #a78bfa;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      line-height: 1.4;
    }

    /* Header */
    .top {
      text-align: center;
      margin-bottom: 18px;
      padding-top: 8px;
    }

    .top h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #38bdf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .top .sub {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Date + controls */
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    input[type="date"] {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color-scheme: dark;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.96); }

    .btn-ghost {
      background: var(--card);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-danger {
      background: rgba(248, 113, 113, 0.15);
      color: var(--red);
    }

    /* Progress card */
    .progress-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-top .label {
      font-size: 0.8rem;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .progress-top .score {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--accent);
    }

    .bar-bg {
      height: 12px;
      background: #0f172a;
      border-radius: 99px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 99px;
      background: linear-gradient(90deg, #0ea5e9, #22c55e);
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .motivation {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
      min-height: 1.2em;
    }

    .motivation.strong {
      color: var(--green);
      font-weight: 600;
    }

    /* Task list */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 20px;
    }

    .item {
      background: var(--card);
      border-radius: 14px;
      padding: 13px 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      border: 1.5px solid var(--border);
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
      cursor: pointer;
      user-select: none;
    }

    .item.anim-block {
      border-color: rgba(34, 197, 94, 0.35);
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.08), var(--card));
    }

    .item.done {
      opacity: 0.55;
      border-color: transparent;
    }

    .item.done .title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .check {
      width: 28px;
      height: 28px;
      min-width: 28px;
      border-radius: 9px;
      border: 2.5px solid #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 800;
      color: transparent;
      margin-top: 1px;
      transition: all 0.18s;
    }

    .item.done .check {
      background: var(--green);
      border-color: var(--green);
      color: white;
      transform: scale(1.05);
    }

    .meta {
      flex: 1;
      min-width: 0;
    }

    .time {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.02em;
      margin-bottom: 2px;
    }

    .title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text);
    }

    .desc {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Share section */
    .share-zone {
      position: sticky;
      bottom: 0;
      background: linear-gradient(to top, var(--bg) 70%, transparent);
      padding: 16px 0 8px;
      margin: 0 -4px;
    }

    .btn-share {
      width: 100%;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: white;
      font-size: 1.05rem;
      font-weight: 800;
      padding: 16px;
      border-radius: 16px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.3);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.2s;
    }

    .btn-share:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25);
    }

    .btn-share svg {
      width: 22px;
      height: 22px;
      fill: white;
    }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 10px;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(30px);
      background: #1e293b;
      color: white;
      padding: 12px 20px;
      border-radius: 99px;
      font-size: 0.9rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
      pointer-events: none;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Confetti canvas */
    #confetti {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>
<body>
  <canvas id="confetti"></canvas>

  <div class="top">
    <h1>Discipline</h1>
    <p class="sub">Elke dag een beetje beter · 19 jaar, focus mode</p>
  </div>

  <div class="controls">
    <input type="date" id="dateInput" />
    <button class="btn btn-ghost" onclick="goToday()">Vandaag</button>
    <button class="btn btn-danger" onclick="resetDay()">Reset</button>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <span class="label">Voortgang</span>
      <span class="score" id="score">0/14</span>
    </div>
    <div class="bar-bg">
      <div class="bar-fill" id="bar"></div>
    </div>
    <div class="motivation" id="motivation">Begin met de eerste taak. Kleine stappen.</div>
  </div>

  <div class="list" id="list"></div>

  <div class="share-zone">
    <button class="btn-share" id="shareBtn" onclick="shareToPapa()">
      <svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Stuur dag naar papa
    </button>
    <p class="hint">Maakt een overzicht en opent WhatsApp · jij krijgt precies te zien wat hij gedaan heeft</p>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const TASKS = [
      { id: "1",  time: "09:00 – 09:30", title: "Opstaan",           emoji: "🌞", desc: "Wassen, aankleden, daglicht",           anim: false },
      { id: "2",  time: "09:30 – 10:30", title: "Ontbijt & koken",   emoji: "🍳", desc: "Samen eten + koken leren",               anim: false },
      { id: "3",  time: "10:30 – 10:50", title: "Huishouden",        emoji: "🧹", desc: "Afwassen / keuken / opruimen",           anim: false },
      { id: "4",  time: "10:50 – 12:50", title: "Animaties",         emoji: "💻", desc: "Eerste werkblok · 2 uur focus",          anim: true  },
      { id: "5",  time: "12:50 – 13:30", title: "Lunch",             emoji: "🍽️", desc: "Samen eten",                             anim: false },
      { id: "6",  time: "13:30 – 15:30", title: "Animaties",         emoji: "💻", desc: "Tweede werkblok · 2 uur focus",          anim: true  },
      { id: "7",  time: "15:30 – 16:00", title: "Pauze",             emoji: "☕", desc: "Rust + tussendoortje",                   anim: false },
      { id: "8",  time: "16:00 – 17:00", title: "Wandelen & sport",  emoji: "🚶", desc: "Bewegen, frisse lucht, samenzijn",       anim: false },
      { id: "9",  time: "17:00 – 18:00", title: "Eigen tijd",        emoji: "🎨", desc: "Vrij of extra uur animaties",            anim: false },
      { id: "10", time: "18:00 – 19:00", title: "Helpen in huis",    emoji: "🏠", desc: "Afgesproken taak",                       anim: false },
      { id: "11", time: "19:00 – 20:00", title: "Avondeten",         emoji: "🍲", desc: "Samen eten",                             anim: false },
      { id: "12", time: "20:00 – 23:30", title: "Vrije tijd",        emoji: "🎮", desc: "Games, vrienden, films, hobby’s",        anim: false },
      { id: "13", time: "23:30 – 00:30", title: "Afbouwen",          emoji: "🌙", desc: "Minder licht, rustiger",                 anim: false },
      { id: "14", time: "00:30 – 01:00", title: "Naar bed",          emoji: "🛏️", desc: "Rond 1:00 slapen",                       anim: false },
    ];

    const MESSAGES = [
      { min: 0,  max: 0,  text: "Nog niks afgevinkt. Eerste taak is de moeilijkste." },
      { min: 1,  max: 3,  text: "Goed begin. Doorzetten." },
      { min: 4,  max: 6,  text: "Je bent op dreef. Houd het vast." },
      { min: 7,  max: 9,  text: "Meer dan de helft. Sterk." },
      { min: 10, max: 12, text: "Bijna klaar. Finish strong." },
      { min: 13, max: 13, text: "Één taak nog. Maak hem af." },
      { min: 14, max: 14, text: "💯 Volledige dag. Respect." },
    ];

    const dateInput = document.getElementById("dateInput");
    const listEl = document.getElementById("list");
    const bar = document.getElementById("bar");
    const scoreEl = document.getElementById("score");
    const motivation = document.getElementById("motivation");
    const toast = document.getElementById("toast");

    function todayStr() {
      const d = new Date();
      const offset = d.getTimezoneOffset();
      const local = new Date(d.getTime() - offset * 60000);
      return local.toISOString().slice(0, 10);
    }

    function key(date) { return "disc_" + date; }

    function load(date) {
      try { return JSON.parse(localStorage.getItem(key(date)) || "{}"); }
      catch { return {}; }
    }

    function save(date, state) {
      localStorage.setItem(key(date), JSON.stringify(state));
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => toast.classList.remove("show"), 2200);
    }

    function getMotivation(done) {
      return MESSAGES.find(m => done >= m.min && done <= m.max)?.text || "";
    }

    let lastFull = false;

    function render() {
      const date = dateInput.value || todayStr();
      const state = load(date);
      listEl.innerHTML = "";

      let done = 0;
      TASKS.forEach(t => {
        if (state[t.id]) done++;

        const div = document.createElement("div");
        div.className = "item" + (t.anim ? " anim-block" : "") + (state[t.id] ? " done" : "");
        div.dataset.id = t.id;
        div.innerHTML = `
          <div class="check">${state[t.id] ? "✓" : ""}</div>
          <div class="meta">
            <div class="time">${t.time}</div>
            <div class="title">${t.emoji} ${t.title}</div>
            <div class="desc">${t.desc}</div>
          </div>
        `;
        div.addEventListener("click", () => toggle(t.id));
        listEl.appendChild(div);
      });

      const pct = Math.round((done / TASKS.length) * 100);
      bar.style.width = pct + "%";
      scoreEl.textContent = done + "/" + TASKS.length;

      const msg = getMotivation(done);
      motivation.textContent = msg;
      motivation.classList.toggle("strong", done === 14);

      // Confetti only when just reached full
      if (done === 14 && !lastFull) {
        fireConfetti();
        if (navigator.vibrate) navigator.vibrate([30, 40, 30]);
      }
      lastFull = (done === 14);
    }

    function toggle(id) {
      const date = dateInput.value;
      const state = load(date);
      state[id] = !state[id];
      save(date, state);
      if (state[id] && navigator.vibrate) navigator.vibrate(12);
      render();
    }

    function goToday() {
      dateInput.value = todayStr();
      render();
    }

    function resetDay() {
      if (!confirm("Alles van deze dag wissen?")) return;
      localStorage.removeItem(key(dateInput.value));
      lastFull = false;
      render();
      showToast("Dag gereset");
    }

    function formatDateNL(iso) {
      const [y, m, d] = iso.split("-");
      const days = ["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
      const dt = new Date(iso + "T12:00:00");
      return `${days[dt.getDay()]} ${d}-${m}-${y}`;
    }

    function buildReport() {
      const date = dateInput.value;
      const state = load(date);
      const done = TASKS.filter(t => state[t.id]);
      const notDone = TASKS.filter(t => !state[t.id]);
      const pct = Math.round((done.length / TASKS.length) * 100);

      let text = `📋 *Discipline checklist*\n`;
      text += `📅 ${formatDateNL(date)}\n`;
      text += `✅ ${done.length}/14 gedaan (${pct}%)\n\n`;

      if (done.length) {
        text += `*Gedaan:*\n`;
        done.forEach(t => text += `✅ ${t.time}  ${t.title}\n`);
        text += `\n`;
      }

      if (notDone.length) {
        text += `*Niet gedaan:*\n`;
        notDone.forEach(t => text += `❌ ${t.time}  ${t.title}\n`);
      }

      if (done.length === 14) {
        text += `\n💯 Volledige dag. Respect.`;
      }

      return text;
    }

    async function shareToPapa() {
      const report = buildReport();
      const date = dateInput.value;

      // Prefer Web Share API (opens WhatsApp / system share)
      if (navigator.share) {
        try {
          await navigator.share({
            title: "Discipline – " + formatDateNL(date),
            text: report
          });
          showToast("Verstuurd / gedeeld");
          return;
        } catch (e) {
          // user cancelled or not supported fully
        }
      }

      // Fallback: copy + open WhatsApp
      try {
        await navigator.clipboard.writeText(report);
        showToast("Gekopieerd – plak in WhatsApp");
      } catch {
        // last resort
        prompt("Kopieer dit bericht en stuur via WhatsApp:", report);
      }

      // Try to open WhatsApp
      const waUrl = "https://wa.me/?text=" + encodeURIComponent(report);
      setTimeout(() => {
        window.open(waUrl, "_blank");
      }, 400);
    }

    // Confetti
    function fireConfetti() {
      const canvas = document.getElementById("confetti");
      const ctx = canvas.getContext("2d");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const pieces = [];
      const colors = ["#38bdf8", "#22c55e", "#a78bfa", "#fbbf24", "#f87171", "#fff"];

      for (let i = 0; i < 80; i++) {
        pieces.push({
          x: Math.random() * canvas.width,
          y: -20 - Math.random() * 100,
          w: 6 + Math.random() * 8,
          h: 4 + Math.random() * 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          vx: (Math.random() - 0.5) * 4,
          vy: 2 + Math.random() * 4,
          rot: Math.random() * 360,
          vr: (Math.random() - 0.5) * 10
        });
      }

      let frames = 0;
      function anim() {
        frames++;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pieces.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.08;
          p.rot += p.vr;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot * Math.PI / 180);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        });
        if (frames < 120) requestAnimationFrame(anim);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      anim();
    }

    // Init
    dateInput.value = todayStr();
    dateInput.addEventListener("change", () => { lastFull = false; render(); });
    render();
  </script>
</body>
</html>
